[project]
name = "keiba-ai-v2"
version = "0.1.0"
description = "JRA trifecta EV system - identify value trifecta combinations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "pandas>=2.3,<3",
    "numpy>=2,<3",
    "lightgbm>=4.6",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "mypy>=1.14",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
