[project]
name = "keiba-ai-v2"
version = "0.1.0"
description = "JRA trifecta EV system - identify value trifecta combinations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "pandas>=2.3,<3",
    "numpy>=2,<3",
    "lightgbm>=4.6",
    "loguru>=0.7",
    "tqdm>=4.66",
    "pyarrow>=14.0",
    "playwright>=1.49",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "click>=8,<9",
    "scikit-learn>=1.9",
    "matplotlib>=3.10",
    "joblib>=1.4",
    "pyyaml>=6",
]

[project.scripts]
keiba = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "mypy>=1.14",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that issue real HTTPS requests to external sites (skipped by default; requires LIVE_SMOKE=1 and ALLOW_LIVE_NETWORK=1)",
    "gated: tests that require the real feature corpus / RUN_GATED=1 (skipped by default; requires RUN_GATED=1)",
]
